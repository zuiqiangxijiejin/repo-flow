name: Extension Package Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'examples/deerflow-extension-*/**'
      - 'scripts/check_extension.py'
      - 'backend/packages/extension-api/**'
      - 'backend/packages/harness/deerflow/extensions/**'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - '.github/workflows/extension-package-check.yml'
  push:
    branches: [main, "*-dev"]
    paths:
      - 'examples/deerflow-extension-*/**'
      - 'scripts/check_extension.py'
      - 'backend/packages/extension-api/**'
      - 'backend/packages/harness/deerflow/extensions/**'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - '.github/workflows/extension-package-check.yml'

permissions:
  contents: read

concurrency:
  group: extension-package-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-packages:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.1'
      - name: Install host dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Build and check all bundled extension packages
        shell: bash
        run: |
          for package in examples/deerflow-extension-*/; do
            echo "::group::Check ${package%/}"
            uv run --project backend --no-sync python scripts/check_extension.py "$package"
            echo "::endgroup::"
          done
      # Python packages use isolated environments against this checkout's API.
      # Browser packages use Node's test runner without Python-only dev extras.
      - name: Test bundled extension packages that ship tests
        shell: bash
        run: |
          for package in examples/deerflow-extension-*/; do
            [ -d "${package}tests" ] || continue
            echo "::group::Test ${package%/}"
            (
              cd "$package"
              shopt -s nullglob globstar
              python_tests=(tests/**/*.py)
              node_tests=(tests/**/*.test.mjs)
              if (( ${#python_tests[@]} )); then
                uv venv --python 3.12
                uv pip install -e ../../backend/packages/extension-api
                uv pip install -e ".[dev]"
                uv run --no-project pytest -q
                uv run --no-project ruff check .
                uv run --no-project ruff format --check .
              fi
              if (( ${#node_tests[@]} )); then
                node --test "${node_tests[@]}"
              fi
              if (( ${#python_tests[@]} == 0 && ${#node_tests[@]} == 0 )); then
                echo "::error::No supported package tests found in $package"
                exit 1
              fi
            )
            echo "::endgroup::"
          done
