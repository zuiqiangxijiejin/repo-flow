[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repoflow-repository-tasks"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["deerflow-extension-api>=0.2.11,<0.3", "httpx>=0.28,<1", "langchain>=1,<2"]

[project.entry-points."deerflow.extensions"]
repoflow-repository-tasks = "repoflow_repository_tasks:install"

[tool.hatch.build.targets.wheel]
packages = ["repoflow_repository_tasks"]
